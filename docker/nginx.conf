server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # 单页应用回退
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Worker 与带哈希的静态资源给正确 MIME 并长效缓存
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }
}
